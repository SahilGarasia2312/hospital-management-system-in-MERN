services:
  - type: web
    name: hpms-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health          # fix: Render pings this — must return 200 for service to go "live"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000                       # fix: Render dynamically assigns PORT=10000 internally — must match
      - key: MONGO_URI
        sync: false                        # Set manually in Render Dashboard → Environment tab
      - key: JWT_SECRET
        sync: false                        # Set manually in Render Dashboard → Environment tab
      - key: JWT_EXPIRES_IN
        value: 7d
