services:
  # ─── Backend API ─────────────────────────────────────────────────────────────
  - type: web
    name: hpms-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    # fix: Do NOT hardcode PORT — Render injects it dynamically; hardcoding causes 503
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false   # set this manually in Render dashboard — never commit secrets
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d

  # ─── Frontend Static Site ─────────────────────────────────────────────────────
  - type: web
    name: hpms-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && REACT_APP_API_URL=https://hospital-management-system-in-mern-2.onrender.com/api npm run build
    staticPublishPath: build
    # fix: React env vars are baked at build time — must pass the live backend URL
    # here, NOT in .env, so the production bundle calls the correct API endpoint.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html  # fix: enables React Router client-side navigation
